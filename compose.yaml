services:
  mtg_ledger:
    build: .
    image: ghcr.io/gab-25/mtg_ledger:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtg_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-mtg_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtg_ledger}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-compose-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      CARDTRADER_API_TOKEN: ${CARDTRADER_API_TOKEN:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtg_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-mtg_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtg_ledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
