{% extends "theme/base.html" %}
{% block title %}Profile and settings{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <div class="eyebrow">Account</div>
    <h1>Change password</h1>
  </div>
</header>
<form method="post" class="panel">
  {% csrf_token %}
  <div class="form-grid" style="grid-template-columns:1fr">
    {% for field in form %}{% include "theme/includes/field.html" with field=field %}{% endfor %}
  </div>
  <div class="form-actions"><div class="group">
    <button type="submit" class="btn btn-primary">Change password</button>
    <a class="btn btn-ghost" href="{% url 'ledger:collection' %}">Cancel</a>
  </div></div>
</form>
{% endblock %}
